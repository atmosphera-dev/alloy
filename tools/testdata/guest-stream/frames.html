<!doctype html>
<meta charset="utf-8">
<title>FRAME_STARTING</title>
<style>html,body { margin:0; width:100%; height:100%; overflow:hidden; } canvas { display:block; width:100%; height:100%; }</style>
<canvas></canvas>
<script>
// Numbered full-image RGB pattern. Title observes source draws; streamed
// physical pixels independently identify delivered unique pictures.
let frame = 0;
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d', { alpha: false });
function draw() {
  canvas.width = Math.ceil(innerWidth * devicePixelRatio);
  canvas.height = Math.ceil(innerHeight * devicePixelRatio);
  frame = frame % 250 + 1;
  context.fillStyle = `rgb(${frame * 3 % 256},${frame * 5 % 256},${frame})`;
  context.fillRect(0, 0, canvas.width, canvas.height);
  document.title = `FRAME_${frame}`;
}
addEventListener('resize', draw);
draw();
setInterval(draw, 100);
</script>
